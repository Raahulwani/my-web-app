<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 10px 0; }
        #result { background: #f0f0f0; padding: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Web App</h1>
        <p>Rahul Wani This is a demo new application for CI/CD pipeline testing.</p>
        
        <button onclick="checkHealth()">Check Health</button>
        <button onclick="sayHello()">Say Hello</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function checkHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    `<h3>Health Check</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = `Error: ${error.message}`;
            }
        }

        async function sayHello() {
            try {
                const response = await fetch('/api/hello/GitHub');
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    `<h3>Hello API</h3><p>${data.message}</p>`;
            } catch (error) {
                document.getElementById('result').innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
